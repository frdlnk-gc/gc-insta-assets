const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},k,b(D.c));
 return new TextDecoder().decode(pt);}
async function go(pw,remember){try{const h=await dec(pw);if(remember)localStorage.setItem("gcip",pw);
 document.open();document.write(h);document.close();}catch(e){localStorage.removeItem("gcip");
 document.getElementById("err").textContent="Falsches Passwort";}}
const saved=localStorage.getItem("gcip");if(saved)go(saved,false);
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("pw").value.trim(),true);});
</script></body></html>
