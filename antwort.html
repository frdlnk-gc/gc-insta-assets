<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Kommentar beantworten – GreenCareers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Poppins:wght@400;500&display=swap">
<style>
body{margin:0;background:#0E1A12;color:#F5F1E8;font:400 16px Poppins,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box}
.card{background:#14231A;border:1px solid #24382B;border-radius:16px;padding:30px 26px;max-width:480px;width:100%}
h1{font-family:Fraunces,serif;font-size:24px;margin:0 0 4px} .sub{color:#9DB0A2;font-size:13.5px;margin:0 0 18px}
.orig{background:#0E1A12;border:1px solid #24382B;border-radius:10px;padding:12px 14px;font-size:14.5px;color:#cfd8d0;margin-bottom:16px;white-space:pre-wrap}
.orig b{color:#7CE0A3}
label{display:block;font-size:13px;color:#9DB0A2;margin:12px 0 6px}
textarea,input{width:100%;box-sizing:border-box;background:#0E1A12;border:1px solid #24382B;border-radius:10px;color:#F5F1E8;font:400 16px Poppins;padding:12px 13px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
button{width:100%;margin-top:16px;background:#16A34A;border:none;border-radius:10px;color:#fff;font:500 16px Poppins;padding:14px;cursor:pointer}
.ok{display:none;text-align:center;padding:30px 0} .ok h2{font-family:Fraunces,serif;font-size:26px}
.err{color:#ff9d9d;font-size:13px;min-height:18px;margin-top:8px}
</style></head><body>
<div class="card">
  <div id="form">
    <h1>💬 Antwort posten</h1>
    <p class="sub">Wird als @greencareers.de direkt unter dem Kommentar veröffentlicht.</p>
    <div class="orig"><b id="user"></b><span id="ctext"></span></div>
    <label>Deine Antwort (Entwurf ist vorausgefüllt – frei anpassen):</label>
    <textarea id="reply"></textarea>
    <label>Passwort:</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="das übliche 😉">
    <button id="send">Antwort veröffentlichen</button>
    <div class="err" id="err"></div>
  </div>
  <div class="ok" id="ok"><h2>✅ Rausgeschickt!</h2><p class="sub">Die Antwort ist live. Fenster kann zu.</p></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const cid = q.get("cid") || "";
document.getElementById("user").textContent = q.get("user") ? "@" + q.get("user") + ": " : "";
document.getElementById("ctext").textContent = q.get("text") || "(Kommentartext siehe Slack)";
document.getElementById("reply").value = q.get("draft") || "";
try { const saved = localStorage.getItem("gcip"); if (saved) document.getElementById("pw").value = saved; } catch(e) {}
document.getElementById("send").addEventListener("click", async () => {
  const reply = document.getElementById("reply").value.trim();
  const pw = document.getElementById("pw").value.trim();
  const err = document.getElementById("err");
  if (!cid) { err.textContent = "Kommentar-ID fehlt im Link."; return; }
  if (!reply) { err.textContent = "Antwort ist leer."; return; }
  if (!pw) { err.textContent = "Passwort fehlt."; return; }
  err.textContent = ""; document.getElementById("send").disabled = true;
  try { localStorage.setItem("gcip", pw); } catch(e) {}
  // Top-Level-Navigation statt fetch (kein CORS-Thema); Make antwortet mit Danke-Seite.
  location.href = "https://hook.eu1.make.com/d2mn81g1p2zmywk9xfelwigpumf8dh9a?cid=" + encodeURIComponent(cid)
    + "&pw=" + encodeURIComponent(pw) + "&reply=" + encodeURIComponent(reply);
});
</script></body></html>
