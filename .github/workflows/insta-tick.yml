# ============================================================
# GC Insta Auto-Post · Zeitgeber
#
# Feuert zu den 6 Posting-Slots (Berlin, Sommerzeit) einen Tick
# an das Make-Szenario "GC Insta Auto-Post" (7081777). Make lädt
# plan.json von insta.green-careers.de und veröffentlicht die
# für diesen Slot geplanten Posts auf Instagram + Facebook.
#
# Slots Berlin -> UTC (MESZ, gültig bis 25.10.2026):
#   08:00->06  10:00->08  11:00->09  12:00->10  17:00->15  18:00->16  19:00->17
# Secrets: MAKE_TICK_HOOK = Feed-Posts (7081777), MAKE_STORY_HOOK = Stories (7101482)
# ============================================================
name: Insta Auto-Post Tick

on:
  schedule:
    - cron: "0 6,8,9,10,15,16,17 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot manuell (HH:MM Berlin)"
        required: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Slot bestimmen und Tick senden
        env:
          HOOK: ${{ secrets.MAKE_TICK_HOOK }}
          STORY_HOOK: ${{ secrets.MAKE_STORY_HOOK }}
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            H_UTC=$(date -u +%H)
            case "$H_UTC" in
              06) SLOT="08:00" ;;
              08) SLOT="10:00" ;;
              09) SLOT="11:00" ;;
              10) SLOT="12:00" ;;
              15) SLOT="17:00" ;;
              16) SLOT="18:00" ;;
              17) SLOT="19:00" ;;
              *) echo "Kein Slot für UTC-Stunde $H_UTC – Ende."; exit 0 ;;
            esac
          fi
          echo "Tick für Slot $SLOT"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 15 --retry-all-errors "$HOOK?slot=$SLOT"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 15 --retry-all-errors "$STORY_HOOK?slot=$SLOT"
