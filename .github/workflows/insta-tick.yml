# ============================================================
# GC Insta Auto-Post · Zeitgeber
#
# Feuert zu den 6 Posting-Slots (Berlin, Sommerzeit) einen Tick
# an das Make-Szenario "GC Insta Auto-Post" (7081777). Make lädt
# plan.json von insta.green-careers.de und veröffentlicht die
# für diesen Slot geplanten Posts auf Instagram + Facebook.
#
# Slots Berlin -> UTC (MESZ, gültig bis 25.10.2026):
#   07:00->05  10:00->08  11:00->09  12:00->10  18:00->16  19:00->17
# Secret: MAKE_TICK_HOOK = Make-Webhook-URL
# ============================================================
name: Insta Auto-Post Tick

on:
  schedule:
    - cron: "0 5,8,9,10,16,17 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot manuell (HH:MM Berlin)"
        required: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Slot bestimmen und Tick senden
        env:
          HOOK: ${{ secrets.MAKE_TICK_HOOK }}
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            H_UTC=$(date -u +%H)
            case "$H_UTC" in
              05) SLOT="07:00" ;;
              08) SLOT="10:00" ;;
              09) SLOT="11:00" ;;
              10) SLOT="12:00" ;;
              16) SLOT="18:00" ;;
              17) SLOT="19:00" ;;
              *) echo "Kein Slot für UTC-Stunde $H_UTC – Ende."; exit 0 ;;
            esac
          fi
          echo "Tick für Slot $SLOT"
          curl --fail-with-body --silent --show-error --max-time 30 "$HOOK?slot=$SLOT"
