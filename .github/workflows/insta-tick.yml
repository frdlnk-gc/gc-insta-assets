# ============================================================
# GC Insta Auto-Post · Zeitgeber
#
# Feuert zu den 6 Posting-Slots (Berlin, Sommerzeit) einen Tick
# an das Make-Szenario "GC Insta Auto-Post" (7081777). Make lädt
# plan.json von insta.green-careers.de und veröffentlicht die
# für diesen Slot geplanten Posts auf Instagram + Facebook.
#
# Slots Berlin -> UTC (MESZ, gültig bis 25.10.2026):
#   08:00->06  10:00->08  11:00->09  12:00->10  17:00->15  18:00->16  19:00->17
# WICHTIG: KEIN --retry-all-errors! Ein Webhook, den Make schon angenommen hat,
# wuerde sonst erneut gefeuert = doppelter Post.
# Secrets: MAKE_TICK_HOOK = Feed-Posts (7081777), MAKE_STORY_HOOK = Stories (7101482)
# ============================================================
name: Insta Auto-Post Tick

on:
  schedule:
    # Je Slot eine EIGENE Cron-Zeile: nur so laesst sich der Slot spaeter
    # eindeutig aus github.event.schedule ableiten.
    - cron: "0 6 * * *"    # 08:00 Berlin
    - cron: "0 8 * * *"    # 10:00 Berlin
    - cron: "0 9 * * *"    # 11:00 Berlin
    - cron: "0 10 * * *"   # 12:00 Berlin
    - cron: "0 15 * * *"   # 17:00 Berlin
    - cron: "0 16 * * *"   # 18:00 Berlin
    - cron: "0 17 * * *"   # 19:00 Berlin
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot manuell (HH:MM Berlin)"
        required: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Slot bestimmen und Tick senden
        env:
          HOOK: ${{ secrets.MAKE_TICK_HOOK }}
          STORY_HOOK: ${{ secrets.MAKE_STORY_HOOK }}
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            # Slot aus der GEPLANTEN Cron-Zeile, NICHT aus der Uhrzeit bei Ausfuehrung.
            # Gemessen 25./26.08.2026: GitHub-Crons starten 27-109 min zu spaet. Mit
            # "date -u +%H" rutscht ein verspaeteter Lauf in die naechste Stunde und
            # faellt aus der Zuordnung - der 19:00-Slot am 26.08. hat so nichts
            # veroeffentlicht, bei gruenem Haken. Genau das darf nicht wieder passieren.
            case "${{ github.event.schedule }}" in
              "0 6 * * *")  SLOT="08:00" ;;
              "0 8 * * *")  SLOT="10:00" ;;
              "0 9 * * *")  SLOT="11:00" ;;
              "0 10 * * *") SLOT="12:00" ;;
              "0 15 * * *") SLOT="17:00" ;;
              "0 16 * * *") SLOT="18:00" ;;
              "0 17 * * *") SLOT="19:00" ;;
              *)
                # Rueckfall, falls github.event.schedule mal leer/unerwartet ankommt:
                # lieber die alte Stundenlogik als gar nichts veroeffentlichen.
                echo "::warning::Cron-Zeile '${{ github.event.schedule }}' unbekannt - Rueckfall auf UTC-Stunde."
                case "$(date -u +%H)" in
                  06) SLOT="08:00" ;; 07) SLOT="08:00" ;;
                  08) SLOT="10:00" ;; 09) SLOT="11:00" ;;
                  10) SLOT="12:00" ;; 15) SLOT="17:00" ;;
                  16) SLOT="18:00" ;; 17) SLOT="19:00" ;;
                  *) echo "::error::Weder Cron-Zeile noch UTC-Stunde ergeben einen Slot."; exit 1 ;;
                esac
                ;;
            esac
          fi
          echo "Tick für Slot $SLOT"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-connrefused --retry-delay 10 "$HOOK?slot=$SLOT"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-connrefused --retry-delay 10 "$STORY_HOOK?slot=$SLOT"
